<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Interviews, documentaries, podcasts, lectures and press coverage of Kent Kiehl's research on psychopathy and of The Psychopath Whisperer.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta property="og:site_name" content="The Psychopath Whisperer">
<meta property="og:title" content="News and press | The Psychopath Whisperer">
<meta property="og:description" content="Interviews, documentaries, podcasts, lectures and press coverage of Kent Kiehl's research on psychopathy and of The Psychopath Whisperer.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://psychopathwhisperer.com/news.html">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://psychopathwhisperer.com/news.html">
<link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml"><link rel="alternate icon" href="assets/favicon-32.png?v=2" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="assets/app.css?v=2">
<link rel="stylesheet" href="assets/site.css?v=2">
<link rel="alternate" type="application/rss+xml" title="The Psychopath Whisperer: news" href="feed.xml">

</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head"><p class="eyebrow">News</p><h1>News and press</h1><p>Interviews, documentaries, podcasts, lectures and coverage of the research. More television, podcasts and recorded lectures are listed on the <a href="https://kentkiehl.com/" target="_blank" rel="noopener">Kiehl Lab website</a>.</p></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="filter-top"><span class="count" id="count"></span></div>
  <div class="news-list" id="list"><div class="spinner">Loading…</div></div>
</main>
<div id="site-footer"></div>
<script src="assets/config.js?v=2"></script>
<script src="assets/app.js?v=3"></script>
<script src="assets/layout.js?v=2"></script>
<script>
(async function () {
  const esc = CL.esc, posts = (await CL.getJSON("data/news_posts.json")).slice().sort(PW.byDate);
  const groups = [["all", "All"], ["press", "Press"], ["av", "TV and podcasts"], ["talk", "Talks"], ["other", "Book and awards"]];
  const grp = k => k === "press" ? "press" : ["tv", "podcast", "interview"].includes(k) ? "av" : k === "talk" ? "talk" : "other";
  let tab = "all";
  document.getElementById("tabs").innerHTML = groups.map(([k, l], i) => `<button class="${i ? "" : "on"}" data-tab="${k}" role="tab">${l}</button>`).join("");
  function render() {
    const shown = posts.filter(p => tab === "all" || grp(p.kind) === tab);
    document.getElementById("count").textContent = `${shown.length} item${shown.length === 1 ? "" : "s"}`;
    document.getElementById("list").innerHTML = shown.map(p => `<article class="post has-img" id="${esc(p.id)}">
      ${PW.thumb(p)}
      <span class="date">${CL.fmtDate(p.date)} · ${esc(PW.kind(p.kind))}</span>
      <h3>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)} ↗</a>` : esc(p.title)}</h3>
      <div class="body">${p.html}</div>
      <span class="src">${esc(p.source || "")}</span></article>`).join("") || '<div class="empty">Nothing here yet.</div>';
  }
  document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.tab; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); render(); });
  render();
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView({ block: "start" }); }
})().catch(e => { document.getElementById("list").innerHTML = `<div class="empty">Could not load (${CL.esc(e.message)}).</div>`; });
</script>
</body>
</html>
