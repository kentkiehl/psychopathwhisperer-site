<script>
(async function () {
  const esc = CL.esc, praise = await CL.getJSON("data/praise.json");
  for (const k of ["expert", "review", "reader"]) document.getElementById("q-" + k).innerHTML = praise.filter(q => q.kind === k).map(q => `<blockquote>“${esc(q.quote)}”<cite>${esc(q.by)}</cite></blockquote>`).join("");
})().catch(e => { document.getElementById("q-expert").innerHTML = `<div class="empty">Could not load (${CL.esc(e.message)}).</div>`; });
