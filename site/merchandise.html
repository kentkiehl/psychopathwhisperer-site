<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | The Psychopath Whisperer</title>
<meta name="description" content="Psychopath Whisperer merchandise. All proceeds support research on better treatments for psychopathy.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta property="og:site_name" content="The Psychopath Whisperer">
<meta property="og:title" content="Merchandise | The Psychopath Whisperer">
<meta property="og:description" content="Psychopath Whisperer merchandise. All proceeds support research on better treatments for psychopathy.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://psychopathwhisperer.com/merchandise.html">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://psychopathwhisperer.com/merchandise.html">
<link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml"><link rel="alternate icon" href="assets/favicon-32.png?v=2" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="assets/app.css?v=2">
<link rel="stylesheet" href="assets/site.css?v=2">
<link rel="alternate" type="application/rss+xml" title="The Psychopath Whisperer: news" href="feed.xml">

<style>
  .shop { display: grid; gap: 1.2rem; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); margin-top: 1rem; }
  .prod { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .prod .pic { aspect-ratio: 1 / 1; background: #fff; display: grid; place-items: center; border-bottom: 1px solid var(--line); }
  .prod .pic svg, .prod .pic img { width: 78%; height: 78%; object-fit: contain; }
  .prod .info { padding: 1rem 1.1rem 1.2rem; display: grid; gap: .4rem; }
  .prod h2 { font-size: 1.2rem; margin: 0; } .prod p { margin: 0; color: var(--ink-2); font-size: .92rem; }
  .prod .row { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-top: .5rem; }
  .prod .price { font-family: var(--serif); font-size: 1.3rem; }
</style>
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head"><p class="eyebrow">Merchandise</p><h1>The Psychopath Whisperer shop</h1><p>All proceeds from merchandise sales go to support research on developing better treatments for psychopathy.</p></div>
  <div id="shopbar"></div>
  <div class="shop" id="shop"><div class="spinner">Loading…</div></div>
  <div id="merch"></div>
  <div class="callout" style="margin-top:2rem" id="shopnote"></div>
</main>
<div id="site-footer"></div>
<script src="assets/config.js?v=3"></script>
<script src="assets/app.js?v=3"></script>
<script src="assets/layout.js?v=3"></script>
<script>
(async function () {
  const esc = CL.esc, d = await CL.getJSON("data/merch.json");
  const mark = (x, y, w) => `<g transform="translate(${x} ${y}) scale(${w / 100})"><ellipse cx="50" cy="20" rx="46" ry="17" fill="none" stroke="#6f8fb0" stroke-width="4"/><text x="50" y="18" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="11.5" fill="#1a2332">Psychopath</text><text x="50" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="11.5" fill="#1a2332">Whisperer</text></g>`;
  const ART = {
    mug: `<svg viewBox="0 0 200 200" role="img" aria-label="Mug"><path d="M40 50h100v95a14 14 0 0 1-14 14H54a14 14 0 0 1-14-14z" fill="#f7f7f5" stroke="#c9ccd1" stroke-width="3"/><path d="M140 72h14a22 22 0 0 1 0 54h-14" fill="none" stroke="#c9ccd1" stroke-width="10"/>${mark(48, 78, 84)}</svg>`,
    tee: `<svg viewBox="0 0 200 200" role="img" aria-label="T-shirt"><path d="M70 30l-45 22 16 34 21-10v94h76V76l21 10 16-34-45-22c-6 12-54 12-60 0z" fill="#f7f7f5" stroke="#c9ccd1" stroke-width="3" stroke-linejoin="round"/>${mark(104, 66, 34)}</svg>`,
    bear: `<svg viewBox="0 0 200 200" role="img" aria-label="Teddy bear"><g fill="#f7f7f5" stroke="#c9ccd1" stroke-width="3"><circle cx="66" cy="38" r="15"/><circle cx="134" cy="38" r="15"/><ellipse cx="46" cy="112" rx="18" ry="13"/><ellipse cx="154" cy="112" rx="18" ry="13"/><ellipse cx="72" cy="172" rx="20" ry="15"/><ellipse cx="128" cy="172" rx="20" ry="15"/><circle cx="100" cy="62" r="40"/><path d="M62 100h76v58a12 12 0 0 1-12 12H74a12 12 0 0 1-12-12z"/></g><circle cx="86" cy="56" r="4" fill="#1a2332"/><circle cx="114" cy="56" r="4" fill="#1a2332"/><ellipse cx="100" cy="70" rx="6" ry="4.5" fill="#1a2332"/><path d="M78 98l22 8 22-8-4 12-18-5-18 5z" fill="#a3232f"/>${mark(70, 116, 60)}</svg>`,
  };
  const open = !!d.shop_url;
  document.getElementById("shopbar").innerHTML = open ? `<p><a class="btn primary" href="${esc(d.shop_url)}" target="_blank" rel="noopener">Visit the shop ↗</a></p>` : "";
  document.getElementById("shop").innerHTML = d.products.map(p => `<article class="prod" id="${esc(p.id)}"><div class="pic">${p.img ? `<img src="assets/img/${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">` : ART[p.art] || ART.mug}</div>
    <div class="info"><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><div class="row"><span class="price">${esc(p.price || "")}</span>${p.buy_url ? `<a class="btn primary" href="${esc(p.buy_url)}" target="_blank" rel="noopener">Buy ↗</a>` : '<span class="badge adjacent">Coming soon</span>'}</div></div></article>`).join("");
  document.getElementById("shopnote").innerHTML = open ? "Orders are handled by our shop partner, which prints and ships each item." : `The shop is being reopened. To be told when items are available, write to ${esc(d.contact)} (<a href="mailto:${esc(d.contact)}">send an email</a>).`;
  PW.img("merch", "merch.png", "Psychopath Whisperer mug, T-shirt and teddy bear");
})().catch(e => { document.getElementById("shop").innerHTML = `<div class="empty">Could not load (${CL.esc(e.message)}).</div>`; });
</script>
</body>
</html>
